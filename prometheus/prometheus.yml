global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "rules/service_alerts.yml"
  - "rules/http_alerts.yml"
  - "rules/processing_alerts.yml"

scrape_configs:

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Cada job declara o target como localhost:PORT (exibido na UI do Prometheus).
  # O relabeling salva 'instance' como localhost:PORT antes de reescrever
  # __address__ para host.docker.internal:PORT (necessário dentro do container).

  - job_name: 'video-upload-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:8083']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - source_labels: [__address__]
        regex: 'localhost:(\d+)'
        target_label: __address__
        replacement: 'host.docker.internal:${1}'
      - target_label: service
        replacement: 'video-upload'

  - job_name: 'video-processing-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:8086']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - source_labels: [__address__]
        regex: 'localhost:(\d+)'
        target_label: __address__
        replacement: 'host.docker.internal:${1}'
      - target_label: service
        replacement: 'video-processing'

  - job_name: 'video-status-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:8084']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - source_labels: [__address__]
        regex: 'localhost:(\d+)'
        target_label: __address__
        replacement: 'host.docker.internal:${1}'
      - target_label: service
        replacement: 'video-status'

  - job_name: 'video-download-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:8085']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - source_labels: [__address__]
        regex: 'localhost:(\d+)'
        target_label: __address__
        replacement: 'host.docker.internal:${1}'
      - target_label: service
        replacement: 'video-download'

  - job_name: 'notification-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:8087']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - source_labels: [__address__]
        regex: 'localhost:(\d+)'
        target_label: __address__
        replacement: 'host.docker.internal:${1}'
      - target_label: service
        replacement: 'notification'
